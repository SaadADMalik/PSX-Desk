name: e2e

# Two levels of end-to-end test:
#   ui     the built web app in a real browser (Playwright), backend mocked from
#          recorded responses. Fast; checks screens and flows.
#   stack  the whole system in Docker, nothing mocked: every service, real service
#          identity and permissions. Runs the security drills, then browser smoke
#          tests. No Groq key exists in CI, so nothing here calls an LLM.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: e2e · browser (mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ui
          path: web/playwright-report
          retention-days: 7

  stack:
    name: e2e · full stack + security drills
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-packages

      - name: Throwaway secrets for this run only
        run: |
          rnd() { openssl rand -hex 24; }
          {
            echo "GROQ_API_KEY=ci-no-llm"
            for v in POSTGRES_PASSWORD GATEWAY_DB_PASSWORD ORCHESTRATOR_DB_PASSWORD \
                     MARKET_DATA_DB_PASSWORD MEMORY_DB_PASSWORD BROKER_DB_PASSWORD \
                     DASHBOARD_PASSWORD DASHBOARD_SESSION_SECRET; do
              echo "$v=$(rnd)"
            done
            grep -E '^(LLM_GATEWAY_URL|ORCHESTRATOR_URL|OTEL_EXPORTER_OTLP_ENDPOINT)=' .env.example
          } > .env
          echo "::add-mask::$(grep ^DASHBOARD_PASSWORD= .env | cut -d= -f2)"
          uv run desk-keygen

      - name: Build and start every service
        run: docker compose up -d --build

      - name: Wait until the app answers
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8701/healthz >/dev/null && \
               curl -fsS http://127.0.0.1:8700/login >/dev/null; then echo "up after $((i*5))s"; break; fi
            sleep 5
          done
          sleep 15   # let agents publish their cards and the orchestrator discover them
          docker compose ps

      - name: Security drills (identity, permissions, separation of duties)
        run: uv run python scripts/security_drills.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser smoke tests against the real stack
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://127.0.0.1:8700 \
          E2E_PASSWORD="$(grep ^DASHBOARD_PASSWORD= ../.env | cut -d= -f2)" \
          npx playwright test

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-stack
          path: web/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose down -v
