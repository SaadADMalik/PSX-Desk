version: 2
# Weekly update PRs, grouped so there are a few PRs a week, not dozens.
# Each one runs ci, e2e and security before it can be merged.
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    open-pull-requests-limit: 3
    # Majors that break the toolchain until the ecosystem catches up:
    # typescript-eslint does not support TypeScript 7 yet, and ESLint 10 needs
    # eslint-config-next to follow. Upgrade these by hand when it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    # Python 3.x releases are "minor" bumps to Dependabot, but onnxruntime (local
    # embeddings in the memory service) ships wheels months after each one.
    # Patch updates of the image still come through.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: monthly }
