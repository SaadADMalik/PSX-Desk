[project]
name = "llm-gateway"
version = "0.1.0"
description = "The only service that talks to Groq: rate limits, priority lanes, fallback, cache, ledger"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "agentkit",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "redis>=5.2",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.scripts]
llm-gateway = "llm_gateway.main:run"

[tool.uv.sources]
contracts = { workspace = true }
agentkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
