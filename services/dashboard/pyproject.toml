[project]
name = "dashboard"
version = "0.1.0"
description = "The app's API: sign-up and JWT sessions, briefs, approvals, live events"
requires-python = ">=3.13"
dependencies = [
    "agentkit",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
    "fastapi>=0.115",
    "redis>=5.2",
    "contracts",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
dashboard = "dashboard.main:run"

[tool.uv.sources]
agentkit = { workspace = true }
contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
