[project]
name = "fundamentals-agent"
version = "0.1.0"
description = "A2A specialist: valuation and income from the PSX screener"
requires-python = ">=3.13"
dependencies = ["agentkit", "contracts"]

[project.scripts]
fundamentals-agent = "fundamentals_agent.main:run"

[tool.uv.sources]
agentkit = { workspace = true }
contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
