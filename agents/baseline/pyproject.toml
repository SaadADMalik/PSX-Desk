[project]
name = "baseline-agent"
version = "0.1.0"
description = "One agent, all tools: the yardstick the multi-agent system must beat"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "agentkit",
    "marketdata",
    "python-dotenv>=1.0",
]

[project.scripts]
baseline-brief = "baseline_agent.cli:main"

[tool.uv.sources]
contracts = { workspace = true }
agentkit = { workspace = true }
marketdata = { workspace = true }

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
