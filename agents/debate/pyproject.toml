[project]
name = "debate-agent"
version = "0.1.0"
description = "A2A agent: bull case, bear case and judgement"
requires-python = ">=3.13"
dependencies = ["agentkit", "contracts"]

[project.scripts]
debate-agent = "debate_agent.main:run"

[tool.uv.sources]
agentkit = { workspace = true }
contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
