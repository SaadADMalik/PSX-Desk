[project]
name = "eventbus"
version = "0.1.0"
description = "Redis Streams event bus: publish, consumer groups, reclaim, dead-letter"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "redis>=5.2",
    "opentelemetry-api>=1.28",
]

[project.scripts]
desk-events = "eventbus.tail:main"

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
