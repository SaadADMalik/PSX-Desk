[project]
name = "marketdata"
version = "0.1.0"
description = "PSX data adapter: fetching, caching, fallback, and indicators computed in code"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "psxdata>=1.1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
